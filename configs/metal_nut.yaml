# Configuration for MVTec AD Metal Nut Anomaly Detection
# Architecture: CAE with L1 Loss and Bottleneck compression (64 channels)

experiment_id: E1_metal_nut_l1_bottleneck_seed42
category: metal_nut
seed: 42

data:
  image_size: [256, 256]
  channels: 3
  val_ratio: 0.2
  batch_size: 16
  num_workers: 2

model:
  name: cae
  in_channels: 3
  base_channels: 32          # 32 -> 64 -> 128 -> 256
  bottleneck_channels: 64    # 4x latent compression
  output_activation: sigmoid

training:
  loss: l1                   # L1 loss for sharp metal edges
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  epochs: 100
  early_stopping_patience: 10

calibration:
  rule: percentile
  image_percentile: 95.0
  image_k_std: 2.0
  pixel_percentile: 99.0

inference:
  error_metric: l1
  top_percent: 0.01
